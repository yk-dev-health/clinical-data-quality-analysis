[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-quality-analysis"
version = "0.1.0"
description = "A clinical data quality toolkit for healthcare datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Clinical Data Quality Analysis Team" }
]
keywords = ["healthcare", "clinical", "data quality", "ETL", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "pandas",
  "numpy",
  "pyyaml",
  "matplotlib",
  "pydantic>=2.0",
  "structlog>=24.0",
  "jinja2",
  "weasyprint",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2.0",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[project.scripts]
healthcli = "healthcli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
