[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-quality-analysis"
version = "0.1.0"
description = "A clinical data quality toolkit for healthcare datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Clinical Data Quality Analysis Team" }
]
keywords = ["healthcare", "clinical", "data quality", "ETL", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "pandas",
  "numpy",
  "pyyaml",
  "matplotlib",
  "pydantic>=2.0",
  "structlog>=24.0",
  "jinja2",
  "weasyprint",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2.0",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pandas-stubs>=2.2",
  "psutil>=5.9",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
# mypy 1.8+ dropped 3.9 support; this is the analysis baseline, not the
# supported runtime floor (see requires-python above).
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "weasyprint.*", "pyarrow.*", "yaml.*"]
ignore_missing_imports = true
follow_imports = "skip"

[project.scripts]
healthcli = "healthcli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
